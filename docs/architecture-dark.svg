<path class="w" d="M494 389H508" marker-end="url(#ah-w)"/><circle class="p" cx="494" cy="389" r="3"/>
<path class="w" d="M622 356V347Q622 339 614 339H198Q190 339 190 331V322" marker-end="url(#ah-w)"/><circle class="p" cx="622" cy="356" r="3"/>
<path class="w" d="M380 356V339"/><circle class="p" cx="380" cy="356" r="3"/><circle class="p" cx="380" cy="339" r="3"/>
<text class="wl" x="436" y="353">Fix loop</text>
<path class="w" d="M622 422V516" marker-end="url(#ah-w)"/><circle class="p" cx="622" cy="422" r="3"/>
